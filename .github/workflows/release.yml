name: Release

on:
  push:
    tags:
      "*.*.*"

permissions:
  contents: write
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Release
        uses: cli/gh-extension-precompile@v2
        with:
          go_version_file: go.mod
